services:
  postgres:
    image: postgres:16-alpine
    container_name: dnsly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dnsly_user
      POSTGRES_PASSWORD: dnsly_password
      POSTGRES_DB: dnsly_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnsly_user -d dnsly_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
